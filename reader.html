<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Reading - Athenaeum</title>
  <link rel="stylesheet" href="css/reader.css?v=3.3.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
</head>
<body data-paper="cream">

  <!-- Mobile Drawer Backdrop -->
  <div class="reader-backdrop" id="reader-backdrop"></div>

  <!-- Reader Sticky Toolbar -->
  <header class="reader-toolbar" id="reader-toolbar">
    <div class="toolbar-left">
      <a href="index.html" class="tool-btn btn-back" title="Back to Library">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span class="btn-text">Library</span>
      </a>

      <button id="btn-toc-toggle" class="tool-btn" title="Table of Contents">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        <span class="btn-text">Chapters</span>
      </button>
    </div>

    <div class="toolbar-center">
      <div class="book-title-display" id="reader-book-title">Loading book...</div>
      <div class="book-author-display" id="reader-book-author"></div>
    </div>

    <div class="toolbar-right">
      <!-- Reading Mode: Scroll Down vs Paginated -->
      <button id="btn-mode-toggle" class="tool-btn" title="Toggle Scroll Down / Page Turn">
        <span class="btn-icon" id="mode-icon">📜</span>
        <span class="btn-text" id="mode-text">Scroll Down</span>
      </button>

      <!-- Paper Type & Style Button -->
      <button id="btn-paper-toggle" class="tool-btn" title="Change Paper Type & Typography">
        <span class="btn-icon">🎨</span>
        <span class="btn-text">Paper & Style</span>
      </button>

      <!-- Zoom controls (for PDF) -->
      <div id="pdf-controls" style="display: none; gap: 4px;">
        <button id="btn-pdf-zoom-out" class="tool-btn" title="Zoom out">-</button>
        <button id="btn-pdf-zoom-in" class="tool-btn" title="Zoom in">+</button>
      </div>

      <!-- Fullscreen -->
      <button id="btn-fullscreen" class="tool-btn" title="Toggle Fullscreen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
      </button>
    </div>
  </header>

  <!-- Paper & Typography Menu -->
  <div class="paper-menu" id="paper-menu">
    <div class="mobile-sheet-header">
      <div class="mobile-sheet-pill"></div>
      <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 12px;">
        <span style="font-weight: 700; font-size: 15px;">Reading Appearance</span>
        <button id="btn-paper-close" class="tool-btn" style="width: 28px; height: 28px; font-size: 18px; border-radius: 50%;">&times;</button>
      </div>
    </div>
    <div class="menu-section-title">Authentic Paper Type</div>
    <div class="paper-options-grid">
      <button class="paper-option-btn" data-paper="white">
        <div class="paper-swatch" style="background: #ffffff;"></div>
        <span class="paper-name">Crisp White</span>
      </button>
      <button class="paper-option-btn active" data-paper="cream">
        <div class="paper-swatch" style="background: #faf6ee;"></div>
        <span class="paper-name">Cream Novel</span>
      </button>
      <button class="paper-option-btn" data-paper="sepia">
        <div class="paper-swatch" style="background: #fbf0d9;"></div>
        <span class="paper-name">Antique Sepia</span>
      </button>
      <button class="paper-option-btn" data-paper="parchment">
        <div class="paper-swatch" style="background: #f5efe6;"></div>
        <span class="paper-name">Parchment</span>
      </button>
      <button class="paper-option-btn" data-paper="newsprint">
        <div class="paper-swatch" style="background: #ebe6dd;"></div>
        <span class="paper-name">Newsprint</span>
      </button>
      <button class="paper-option-btn" data-paper="charcoal">
        <div class="paper-swatch" style="background: #18181b;"></div>
        <span class="paper-name">Charcoal Slate</span>
      </button>
    </div>

    <div class="menu-section-title">Typography & Size</div>
    <div class="style-control-row">
      <span class="style-control-label">Font Family</span>
      <select id="font-family-select" class="font-select">
        <option value="Merriweather, Georgia, serif">Merriweather (Book Serif)</option>
        <option value="'Playfair Display', Georgia, serif">Playfair Display (Editorial)</option>
        <option value="'Inter', -apple-system, sans-serif">Inter (Clean Sans)</option>
        <option value="Georgia, serif">Georgia (Classic)</option>
      </select>
    </div>

    <div class="style-control-row">
      <span class="style-control-label">Font Size</span>
      <div style="display: flex; gap: 6px; align-items: center;">
        <button id="btn-font-dec" class="tool-btn" style="height: 28px; width: 28px; border: 1px solid #cbd5e1;">A-</button>
        <span id="font-size-label" style="font-size: 12px; font-weight: 600; min-width: 38px; text-align: center;">100%</span>
        <button id="btn-font-inc" class="tool-btn" style="height: 28px; width: 28px; border: 1px solid #cbd5e1;">A+</button>
      </div>
    </div>

    <div class="style-control-row">
      <span class="style-control-label">Reading Mode</span>
      <select id="reading-mode-select" class="font-select">
        <option value="scroll" selected>📜 Vertical Scroll Down</option>
        <option value="paginated">📖 Clean Page Turn</option>
      </select>
    </div>

    <div class="style-control-row">
      <span class="style-control-label">Text Alignment</span>
      <select id="text-align-select" class="font-select">
        <option value="left" selected>Left (Natural spacing, no gaps)</option>
        <option value="justify">Justified (Book layout)</option>
      </select>
    </div>
  </div>

  <!-- Reader Main Layout -->
  <div class="reader-container">

    <!-- Table of Contents Sidebar -->
    <aside class="reader-sidebar" id="reader-sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Table of Contents</span>
        <button id="btn-sidebar-close" class="tool-btn" style="width: 28px; height: 28px;">&times;</button>
      </div>
      <div class="sidebar-content" id="toc-list">
        <div style="padding: 16px; font-size: 13px; color: var(--text-muted);">No chapters found</div>
      </div>
    </aside>

    <!-- 3D Book Stage -->
    <main class="book-stage" id="book-stage">
      <!-- Loading Overlay -->
      <div class="loader-container" id="reader-loader">
        <div class="loader-spinner"></div>
        <p style="font-size: 14px; font-weight: 600;" id="loader-title">Opening Book...</p>
        <p style="font-size: 12px; opacity: 0.7;" id="loader-status">Preloading content into memory...</p>
      </div>

      <!-- Navigation Arrows -->
      <button class="nav-arrow prev" id="btn-nav-prev" title="Previous page (Left Arrow)">&#10094;</button>
      <button class="nav-arrow next" id="btn-nav-next" title="Next page (Right Arrow)">&#10095;</button>

      <!-- Book Page 3D Wrapper -->
      <div class="book-page-wrapper" id="book-page-wrapper">
        <div class="spine-shadow-overlay"></div>
        <div class="book-edge-stack left"></div>
        <div class="book-edge-stack right"></div>



        <!-- EPUB Viewer -->
        <div id="epub-viewer"></div>

        <!-- PDF Viewer -->
        <div id="pdf-viewer-container" style="display: none;">
          <canvas id="pdf-canvas"></canvas>
        </div>
      </div>
    </main>

  </div>

  <!-- Cross-Device Reading Resume Banner -->
  <div class="sync-resume-banner" id="sync-resume-banner" style="display: none;">
    <div class="resume-banner-content">
      <span class="resume-device-icon" id="resume-device-icon">📱</span>
      <span class="resume-text">Synced from <strong id="resume-device-label">Phone</strong>: <span id="resume-position-desc">Page 42 (35%)</span></span>
      <button type="button" class="btn-resume-action" id="btn-resume-now">Resume</button>
      <button type="button" class="btn-resume-dismiss" id="btn-resume-dismiss" title="Dismiss">&times;</button>
    </div>
  </div>

  <!-- Reader Footer / Progress Bar -->
  <footer class="reader-footer" id="reader-footer">
    <div id="reader-progress-text">Page 1</div>
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progress-bar-fill"></div>
    </div>
    <div id="reader-percentage">0%</div>
  </footer>

  <!-- Vendor Libraries & DB -->
  <script src="js/vendor/jszip.min.js"></script>
  <script src="js/vendor/epub.min.js"></script>
  <script src="js/vendor/pdf.min.js"></script>
  <script src="js/db.js?v=3.3.0"></script>
  <script src="js/sync.js?v=3.3.0"></script>

  <!-- Reader Script -->
  <script src="js/reader.js?v=3.3.0"></script>
</body>
</html>
